<!-- https://www.flaticon.com/free-icons/weather -->
<!-- https://api.weatherapi.com/v1/forecast.json?key=bf3df55bd7eb48d6a58172104260606&q=Mumbai&days=7&aqi=yes&alerts=yes -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <script src="script.js"></script>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="site-header">
        <div class="head">
            <div class="weather">
                <img src="https://cdn-icons-png.flaticon.com/128/4503/4503058.png" alt="weather Img">
                <h1>Weather</h1>
            </div>
            <div class="options">
                <img src="https://cdn-icons-png.flaticon.com/128/2976/2976215.png" alt="option img">
            </div>
        </div>
        <div class="searchdiv">
            <form class="searchsys" onsubmit="getWeather(); return false;">
                <img  src="https://cdn-icons-png.flaticon.com/128/18290/18290728.png" alt="search icon">
                <input id="searchbar" type="search" placeholder="Enter City Name">
                <input id="searchbt" type="button" onclick="getWeather()" value="Search">
            </form>
        </div>
    </div>
    <br>
    <div class="main">
        <div class="current">
            <div class="basic-left">
                <div class="cityname"><h2 id="cityname"></h2></div>
                <div class="ctemp" ><h1 id="ctemp"></h1><h3>°C</h3></div>
                <div class="minmax"><h3 id="min-max"></h3></div>
                <div class="feels-like"><h3 id="feels-like"></h3></div>
                <div class="conditions"><h4 id="conditions"></h4></div>
            </div>
            <div class="basic-right">
                <img id="brimg">
            </div>
        </div>
        <div class="current-other">
            <div class="cloud">
                <div class="cloudh">
                    <img class="wimg" src="https://cdn-icons-png.flaticon.com/128/1163/1163624.png" alt="co img">
                    <h3>Cloud Cover</h3>
                </div>
                <div class="cloudd">
                    <p id="cod"></p>
                </div>
            </div>
            <div class="cloud" >
                <div class="cloudh">
                    <img class="wimg" src="https://cdn-icons-png.flaticon.com/128/4088/4088981.png" alt="cr img">
                    <h3>Chance of Rain</h3>
                </div>
                <div class="cloudd">
                    <p id="crd"></p>
                </div>
            </div>
        </div>
        <div class="weekly">
            <div class="weekday"><h5 id="day0"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain0"></p><h5 id="minmax0"></h5></div>
            <div class="weekday"><h5 id="day1"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain1"></p><h5 id="minmax1"></h5></div>
            <div class="weekday"><h5 id="day2"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain2"></p><h5 id="minmax2"></h5></div>
            <div class="weekday"><h5 id="day3"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain3"></p><h5 id="minmax3"></h5></div>
            <div class="weekday"><h5 id="day4"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain4"></p><h5 id="minmax4"></h5></div>
            <div class="weekday"><h5 id="day5"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain5"></p><h5 id="minmax5"></h5></div>
            <div class="weekday"><h5 id="day6"></h5><img id="raindrop" src="https://cdn-icons-png.flaticon.com/128/427/427112.png" alt=""><p id="rain6"></p><h5 id="minmax6"></h5></div>
        </div>
        <div class="todays-other">
            <div class="aqi">
                <h4>AQI</h4>
                <p id="aqi"></p>
            </div>
            <div class="hwvdup">
                <div class="ot"><h5>Humidity</h5><p id="humidity"></p></div>
                <div class="ot"><h5>Wind</h5><p id="wind"></p></div>
                <div class="ot"><h5>UV Index</h5><p id="uv"></p></div>
                <div class="ot"><h5>Pressure</h5><p id="pressure"></p></div>
                <div class="ot"><h5>Visiblity</h5><p id="visiblity"></p></div>
                <div class="ot"><h5>Dew Point</h5><p id="dew"></p></div>
            </div>
        </div>
        <div class="rise">
            <div class="riseh">
                <h4>Sunrise</h4>
                <p id="sunrise"></p>
            </div>
            <div class="riseimg">
                <img class="riseimg" src="https://cdn-icons-png.flaticon.com/128/10484/10484158.png" alt="">
            </div>
            <div class="riseh">
                <h4>Sunset</h4>
                <p id="sunset"></p>
            </div>
        </div>
        <div class="rise">
            <div class="riseh">
                <h4>Moonrise</h4>
                <p id="moonrise"></p>
            </div>
            <div class="riseimg">
                <img class="riseimg" src="https://cdn-icons-png.flaticon.com/128/581/581601.png" alt="">
            </div>
            <div class="riseh">
                <h4>Moonset</h4>
                <p id="moonset"></p>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="update">
            <p>Source: <a href="https://api.weatherapi.com/">https://api.weatherapi.com/</a></p>
            <div class="content">
                <p>Updated </p>
                <p id="updated"></p>
            </div>
        </div>
        <div class="update">
            <p>Copyright © | Kunal Nimje. All rights reserved.</p>
            <div class="content">
                <a  href="https://www.linkedin.com/in/kunalnimje00/"><img id="updateimg1" src="https://img.icons8.com/?size=100&id=8808&format=png" alt="linkedin img"></a>
                <a  href="https://github.com/kunalnimje00"><img id="updateimg2" src="https://cdn-icons-png.flaticon.com/128/3291/3291695.png" alt="github img"></a>
            </div>
            
        </div>
    </div>
</body>

</html>
